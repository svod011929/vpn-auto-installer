name: Test VPN Auto-Installer

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    name: Shellcheck

    steps:
    - uses: actions/checkout@v4

    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@master
      with:
        scandir: '.'
        format: gcc
        severity: warning

  test-ubuntu:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Test installation script syntax
      run: |
        chmod +x vpn-auto-installer.sh
        bash -n vpn-auto-installer.sh

    - name: Test config generator syntax  
      run: |
        chmod +x generate-configs.sh
        bash -n generate-configs.sh

    - name: Test maintenance script syntax
      run: |
        chmod +x maintenance.sh  
        bash -n maintenance.sh

    - name: Test Docker Compose
      run: |
        docker-compose config
